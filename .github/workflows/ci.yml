name: Weather Pipeline CI

on:
# Run pipeline when changes are pushed to the main branch
  push:
    branches: [ main ]
  # Validate workflow for pull requests
  pull_request:
  schedule:
    # Run the pipeline automatically every hour
    - cron: "0 * * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # Check out repository contents
      - name: Checkout repo
        uses: actions/checkout@v4

      # Configure Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install project dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyspark

      # Download PostgreSQL JDBC driver required by PySpark
      - name: Download PostgreSQL JDBC Driver
        run: |
            curl -L -o src/postgresql-42.7.3.jar https://jdbc.postgresql.org/download/postgresql-42.7.3.jar


      # Execute the ETL pipeline using secure credentials (GitHub Secrets)
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
        run: |
          python src/main.py
